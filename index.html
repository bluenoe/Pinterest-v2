<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0a0d" media="(prefers-color-scheme: dark)">
    <title>Gallery</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cg fill='white'%3E%3Crect x='7' y='7' width='8' height='11' rx='2'/%3E%3Crect x='17' y='7' width='8' height='7' rx='2'/%3E%3Crect x='7' y='20' width='8' height='5' rx='2'/%3E%3Crect x='17' y='16' width='8' height='9' rx='2'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="dist/styles.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    <!-- Icon sprite (thin-line icons, 24×24, stroke = currentColor) -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5Z"/></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
        <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
        <symbol id="i-skip-back" viewBox="0 0 24 24"><path d="M18 19 8 12l10-7Z"/><path d="M6 5v14"/></symbol>
        <symbol id="i-skip-forward" viewBox="0 0 24 24"><path d="m6 5 10 7-10 7Z"/><path d="M18 5v14"/></symbol>
        <symbol id="i-chevrons-down" viewBox="0 0 24 24"><path d="m7 6 5 5 5-5"/><path d="m7 13 5 5 5-5"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
        <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14"/></symbol>
        <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></symbol>
        <!-- Brand mark: four masonry tiles (filled, not stroked) -->
        <symbol id="i-logo" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="9.5" rx="1.8"/><rect x="13" y="4" width="7" height="6" rx="1.8"/><rect x="4" y="15.5" width="7" height="4.5" rx="1.8"/><rect x="13" y="12" width="7" height="8" rx="1.8"/></symbol>
    </svg>

    <!-- Loading -->
    <div id="loadingOverlay" class="loading hidden" role="status" aria-live="polite">
        <div class="loading-box">
            <span class="spinner" aria-hidden="true"></span>
            <span id="loadingText">Loading images...</span>
        </div>
    </div>

    <!-- Welcome -->
    <div id="welcomeScreen" class="welcome">
        <div class="welcome-glow" aria-hidden="true"></div>
        <div class="welcome-inner">
            <div class="welcome-hero">
                <div class="brand"><span class="brand-dot" aria-hidden="true"><svg class="brand-mark"><use href="#i-logo"></use></svg></span>Gallery</div>

                <h1 class="welcome-title">Your photos,<br><span class="title-accent">quietly arranged.</span></h1>
                <p class="welcome-sub">Open a folder and browse it as one calm, endless grid.</p>

                <!-- Decorative stack of "photos" (wide screens only) -->
                <div class="welcome-art" aria-hidden="true">
                    <span class="art-card art-1"></span>
                    <span class="art-card art-2"></span>
                    <span class="art-card art-3"></span>
                </div>
            </div>

            <div class="welcome-panel">
                <!-- Remembered folders (Chrome/Edge) -->
                <section id="recentSection" class="recent hidden" aria-label="Recent folders">
                    <button id="continueBtn" type="button" class="continue-btn hidden">
                        <span class="continue-icon" aria-hidden="true"><svg class="icon"><use href="#i-play"></use></svg></span>
                        <span class="continue-text">
                            <span class="continue-label">Continue</span>
                            <span id="continueNames" class="continue-names"></span>
                        </span>
                        <span id="continueMeta" class="continue-meta"></span>
                        <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
                    </button>
                    <p class="recent-head">Recent</p>
                    <div id="recentList" class="recent-list"></div>
                </section>

                <div id="dropZone" class="drop-zone">
                    <input type="file" id="folderInput" class="sr-only" tabindex="-1" aria-hidden="true" webkitdirectory directory multiple>
                    <span class="drop-badge" aria-hidden="true"><svg class="icon drop-icon"><use href="#i-upload"></use></svg></span>
                    <p class="drop-title">Drop a folder here</p>
                    <p class="drop-or">or</p>
                    <button id="chooseFolderBtn" type="button" class="btn btn-secondary">
                        <span data-label>Choose a folder</span>
                    </button>
                </div>

                <div id="selectedFoldersList" class="folder-list"></div>

                <button id="startGallery" class="btn btn-primary btn-block hidden" disabled>Start Exploring</button>

                <p class="welcome-note">
                    <svg class="icon" aria-hidden="true"><use href="#i-lock"></use></svg>
                    Processed locally. Your photos never leave this device.
                </p>
            </div>
        </div>
    </div>

    <!-- Gallery -->
    <div id="galleryContainer" class="hidden">
        <header id="topbar" class="topbar">
            <div class="topbar-inner">
                <button type="button" class="brand brand-btn" onclick="location.reload()" title="Home" aria-label="Home">
                    <span class="brand-dot" aria-hidden="true"><svg class="brand-mark"><use href="#i-logo"></use></svg></span><span class="brand-text">Gallery</span>
                </button>

                <div class="search">
                    <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"></use></svg>
                    <input type="search" id="searchInput" class="search-input" placeholder="Search" autocomplete="off" aria-label="Search photos">
                    <button id="clearSearchBtn" type="button" class="search-clear hidden" title="Clear search (Esc)" aria-label="Clear search">
                        <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
                    </button>
                    <kbd class="search-kbd" aria-hidden="true">/</kbd>
                </div>

                <div class="topbar-actions">
                    <div id="albumSelector" class="album hidden">
                        <select id="albumSelect" class="album-select" aria-label="Album">
                            <option value="all">All</option>
                        </select>
                    </div>
                    <div class="sort">
                        <select id="sortSelect" class="album-select" aria-label="Sort photos">
                            <option value="name">Name</option>
                            <option value="newest">Newest</option>
                            <option value="oldest">Oldest</option>
                            <option value="largest">Largest</option>
                        </select>
                    </div>
                    <span id="photoCount" class="photo-count"></span>
                    <span class="topbar-sep" aria-hidden="true"></span>

                    <button id="favoritesToggle" class="icon-btn" title="Favorites only" aria-label="Show favorites only" aria-pressed="false">
                        <svg class="icon" aria-hidden="true"><use href="#i-heart"></use></svg>
                    </button>
                    <button id="slideshowBtn" class="icon-btn" title="Slideshow" aria-label="Slideshow" aria-pressed="false">
                        <svg class="icon" aria-hidden="true"><use href="#i-play"></use></svg>
                    </button>
                    <button id="autoScrollBtn" class="icon-btn" title="Auto scroll" aria-label="Auto scroll" aria-pressed="false">
                        <svg class="icon" aria-hidden="true"><use href="#i-chevrons-down"></use></svg>
                    </button>
                    <button id="darkModeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
                        <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"></use></svg>
                        <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"></use></svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="gallery-main">
            <div id="galleryGrid" class="masonry-grid"></div>

            <div id="loadMoreContainer" class="load-more hidden">
                <button id="loadMoreBtn" class="btn btn-secondary">Load more</button>
            </div>

            <div id="noResults" class="empty hidden">
                <span class="empty-badge" aria-hidden="true"><svg class="icon"><use href="#i-search"></use></svg></span>
                <p class="empty-title">Nothing here</p>
                <p class="empty-sub">No photos match your search or filters.</p>
                <button id="clearFiltersBtn" type="button" class="btn btn-secondary">Clear filters</button>
            </div>
        </main>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="hidden" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
        <span id="lightboxCounter" class="lb-counter"></span>
        <button id="closeLightbox" class="lb-btn lb-close" title="Close (Esc)" aria-label="Close">
            <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>

        <button id="prevImage" class="lb-nav lb-prev" title="Previous (←)" aria-label="Previous photo">
            <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
        </button>
        <button id="nextImage" class="lb-nav lb-next" title="Next (→)" aria-label="Next photo">
            <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
        </button>

        <div class="lightbox-content-container">
            <div class="lightbox-image-container">
                <img id="lightboxImage" class="lightbox-image" alt="" draggable="false">
            </div>

            <div class="lightbox-info-bar">
                <div class="lb-meta">
                    <h3 id="lightboxTitle" class="lb-title"></h3>
                    <p id="lightboxInfo" class="lb-info"></p>
                </div>
                <div class="lb-actions">
                    <button id="lightboxPlayBtn" class="lb-btn" title="Slideshow from here (Space)" aria-label="Start slideshow from this photo">
                        <svg class="icon" aria-hidden="true"><use href="#i-play"></use></svg>
                    </button>
                    <button id="favoriteBtn" class="lb-btn lb-fav" title="Favorite (F)" aria-label="Favorite" aria-pressed="false">
                        <svg class="icon" aria-hidden="true"><use href="#i-heart"></use></svg>
                    </button>
                    <button id="downloadBtn" class="lb-btn" title="Download (D)" aria-label="Download">
                        <svg class="icon" aria-hidden="true"><use href="#i-download"></use></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Slideshow controls -->
    <div id="slideshowControls" class="slideshow-bar hidden">
        <span id="slideshowCounter" class="slideshow-counter"></span>
        <button id="slideshowPrevBtn" class="lb-btn" aria-label="Previous photo">
            <svg class="icon" aria-hidden="true"><use href="#i-skip-back"></use></svg>
        </button>
        <button id="slideshowPlayPauseBtn" class="lb-btn" aria-label="Pause">
            <svg class="icon" aria-hidden="true"><use href="#i-pause"></use></svg>
        </button>
        <button id="slideshowNextBtn" class="lb-btn" aria-label="Next photo">
            <svg class="icon" aria-hidden="true"><use href="#i-skip-forward"></use></svg>
        </button>
        <select id="slideshowInterval" class="slideshow-speed" aria-label="Slideshow speed">
            <option value="2000">2s</option>
            <option value="3000" selected>3s</option>
            <option value="5000">5s</option>
            <option value="7000">7s</option>
            <option value="10000">10s</option>
        </select>
        <button id="slideshowStopBtn" class="lb-btn" aria-label="Stop slideshow">
            <svg class="icon" aria-hidden="true"><use href="#i-stop"></use></svg>
        </button>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
